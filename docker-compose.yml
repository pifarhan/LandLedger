services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-land_records}
      POSTGRES_USER: ${POSTGRES_USER:-land_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-land_user} -d ${POSTGRES_DB:-land_records}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_MODE: postgres
      POSTGRES_URL: postgresql://${POSTGRES_USER:-land_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-land_records}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: uploads
      FABRIC_MODE: ${FABRIC_MODE:-mock}
      FABRIC_IDENTITY_CERT: ${FABRIC_IDENTITY_CERT:-}
      FABRIC_IDENTITY_KEY_DIR: ${FABRIC_IDENTITY_KEY_DIR:-}
      FABRIC_AUTHORITY_IDENTITY_CERT: ${FABRIC_AUTHORITY_IDENTITY_CERT:-}
      FABRIC_AUTHORITY_IDENTITY_KEY_DIR: ${FABRIC_AUTHORITY_IDENTITY_KEY_DIR:-}
      FABRIC_AUTHORITY_MSP_ID: ${FABRIC_AUTHORITY_MSP_ID:-}
      FABRIC_TLS_CERT: ${FABRIC_TLS_CERT:-}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-localhost:7051}
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-landchannel}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-landrecords}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-Org1MSP}
      FABRIC_TLS_SERVER_NAME: ${FABRIC_TLS_SERVER_NAME:-peer0.org1.example.com}
      BOOTSTRAP_AUTHORITY_NAME: ${BOOTSTRAP_AUTHORITY_NAME:-}
      BOOTSTRAP_AUTHORITY_EMAIL: ${BOOTSTRAP_AUTHORITY_EMAIL:-}
      BOOTSTRAP_AUTHORITY_PASSWORD: ${BOOTSTRAP_AUTHORITY_PASSWORD:-}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
